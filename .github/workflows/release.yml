name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v1.0.1. Leave empty to only build and keep the files as workflow artifacts"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            tag="$REF_NAME"
          else
            tag="$(printf '%s' "$INPUT_TAG" | tr -d '[:space:]')"
          fi
          if [ -n "$tag" ] && ! [[ "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]; then
            echo "::error::Invalid tag name: $tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${tag:-<none, build artifacts only>}"

      - name: Cache Godot editor
        id: editor-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-editor-linux

      - name: Download Godot editor
        if: steps.editor-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot
          cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSLf -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          rm godot.zip
          chmod +x godot

      - name: Cache export templates
        id: templates-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-${{ env.GODOT_VERSION }}-templates-win-web

      - name: Download and extract export templates
        if: steps.templates-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          tpz="$RUNNER_TEMP/godot-export-templates.tpz"
          trap 'rm -f "$tpz"' EXIT
          curl -sSLf -o "$tpz" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j "$tpz" \
            'templates/windows_release_x86_64.exe' \
            'templates/windows_debug_x86_64.exe' \
            'templates/windows_release_x86_64_console.exe' \
            'templates/windows_debug_x86_64_console.exe' \
            'templates/web_nothreads_release.zip' \
            'templates/web_nothreads_debug.zip' \
            'templates/version.txt' \
            -d "$dest"
          rm -f "$tpz"
          ls -la "$dest"

      - name: Import project
        run: |
          set -euo pipefail
          ~/godot/godot --headless --editor --quit --path . || true

      - name: Export Windows
        run: |
          set -euo pipefail
          mkdir -p build/windows
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/windows/TowerTiles.exe

      - name: Export Web
        run: |
          set -euo pipefail
          mkdir -p build/web
          ~/godot/godot --headless --path . --export-release "Web" build/web/index.html

      - name: Verify export outputs
        run: |
          set -euo pipefail
          status=0
          for f in build/windows/TowerTiles.exe build/web/index.html; do
            if ! test -f "$f"; then
              echo "::error::Export output missing: $f"
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            ls -la build build/windows build/web || true
            exit 1
          fi
          ls -la build/windows build/web

      - name: Package and checksum
        run: |
          set -euo pipefail
          (cd build/windows && zip -9 ../../TowerTiles-Windows.zip TowerTiles.exe)
          (cd build/web && zip -r -9 ../../TowerTiles-Web.zip .)
          sha256sum TowerTiles-Windows.zip TowerTiles-Web.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -la TowerTiles-Windows.zip TowerTiles-Web.zip SHA256SUMS.txt

      - name: Publish GitHub Release
        if: steps.meta.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          ## Downloads

          **Windows:** download `TowerTiles-Windows.zip`, unzip, run `TowerTiles.exe` (Windows may show a SmartScreen warning because the exe is not code-signed: choose *More info → Run anyway*).

          **Web / itch.io:** `TowerTiles-Web.zip` is the HTML5 build with `index.html` at the root: upload it to itch.io as "This file will be played in the browser".

          Verify downloads with `SHA256SUMS.txt`.
          EOF
          assets=(TowerTiles-Windows.zip TowerTiles-Web.zip SHA256SUMS.txt)
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its assets."
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "Tower Tiles $TAG" \
              --notes-file release-notes.md \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi

      - name: Upload build artifacts
        if: steps.meta.outputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: tower-tiles-builds
          path: |
            TowerTiles-Windows.zip
            TowerTiles-Web.zip
            SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
